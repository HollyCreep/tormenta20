    <meta name="mobile-web-app-capable" content="yes" />

    <title>Tormenta 20 — Criador e Ficha de Personagem | Jogo do Ano</title>
    <meta name="description" content="Crie e gerencie fichas de Tormenta 20 (Edição Jogo do Ano v1.3) com cálculos transparentes, regras citadas e interface pensada para o celular." />
    <!-- Aplica o tema salvo antes da primeira pintura (evita o "flash" do tema padrão) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('t20_app_theme');
          if (t !== 'modern-dark' && t !== 'light' && t !== 't20-classic') t = 't20-classic';
          document.documentElement.setAttribute('data-theme', t);
          var c = { 't20-classic': '#110d0a', 'modern-dark': '#09090b', light: '#f3ede1' }[t];
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
        } catch (e) {}
      })();
    </script>
    <!-- Cinzel (títulos de fantasia), Outfit (interface) e Fira Code (números e fórmulas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
